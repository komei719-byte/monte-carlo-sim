<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2資産 モンテカルロ・シミュレーター</title>
    <!-- Tailwind CSS (デザイン用) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js (グラフ描画用) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 p-4 md:p-8">

    <div class="max-w-6xl mx-auto space-y-6">
        <!-- ヘッダー -->
        <header class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h1 class="text-2xl font-bold text-slate-900">2資産 モンテカルロ・シミュレーター</h1>
            <p class="text-slate-500 text-sm mt-1">リバランスおよび譲渡所得課税（含み益への課税）を考慮した長期投資推移のシミュレーション</p>
        </header>

        <!-- メイングリッド -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- パラメーター設定フォーム -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-6">
                
                <!-- 資産A設定 -->
                <div class="p-4 bg-slate-50 rounded-lg space-y-3 border border-slate-200">
                    <h2 class="font-bold text-slate-700 flex justify-between items-center">
                        資産 A
                        <label class="text-xs text-slate-500 flex items-center gap-1 cursor-pointer">
                            <input type="checkbox" id="isCashA" class="rounded border-slate-300 text-indigo-600">
                            CASH (非課税)
                        </label>
                    </h2>
                    <div class="grid grid-cols-2 gap-2 text-sm">
                        <div>
                            <label class="block text-slate-600 text-xs">リターン (%)</label>
                            <input type="number" id="returnA" value="5.0" step="0.1" class="w-full mt-1 border rounded px-2 py-1">
                        </div>
                        <div>
                            <label class="block text-slate-600 text-xs">ボラティリティ (%)</label>
                            <input type="number" id="volA" value="15.0" step="0.1" class="w-full mt-1 border rounded px-2 py-1">
                        </div>
                    </div>
                    <div>
                        <label class="block text-slate-600 text-xs">配分比率 (%)</label>
                        <input type="number" id="weightA" value="50" min="0" max="100" class="w-full mt-1 border rounded px-2 py-1 font-semibold">
                    </div>
                </div>

                <!-- 資産B設定 -->
                <div class="p-4 bg-slate-50 rounded-lg space-y-3 border border-slate-200">
                    <h2 class="font-bold text-slate-700 flex justify-between items-center">
                        資産 B
                        <label class="text-xs text-slate-500 flex items-center gap-1 cursor-pointer">
                            <input type="checkbox" id="isCashB" class="rounded border-slate-300 text-indigo-600">
                            CASH (非課税)
                        </label>
                    </h2>
                    <div class="grid grid-cols-2 gap-2 text-sm">
                        <div>
                            <label class="block text-slate-600 text-xs">リターン (%)</label>
                            <input type="number" id="returnB" value="1.0" step="0.1" class="w-full mt-1 border rounded px-2 py-1">
                        </div>
                        <div>
                            <label class="block text-slate-600 text-xs">ボラティリティ (%)</label>
                            <input type="number" id="volB" value="5.0" step="0.1" class="w-full mt-1 border rounded px-2 py-1">
                        </div>
                    </div>
                    <div>
                        <label class="block text-slate-600 text-xs">配分比率 (%)</label>
                        <input type="number" id="weightB" value="50" min="0" max="100" class="w-full mt-1 border rounded px-2 py-1 font-semibold" readonly>
                    </div>
                </div>

                <!-- 共通パラメーター -->
                <div class="space-y-3 text-sm">
                    <div>
                        <label class="block text-slate-600 text-xs">相関係数 (-1.0 ～ +1.0)</label>
                        <input type="number" id="correlation" value="0.2" step="0.05" min="-1" max="1" class="w-full mt-1 border rounded px-2 py-1">
                    </div>
                    <div>
                        <label class="block text-slate-600 text-xs">譲渡所得税率 (%)</label>
                        <input type="number" id="taxRate" value="20.315" step="0.001" class="w-full mt-1 border rounded px-2 py-1">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-slate-600 text-xs">初期資産額 (万円)</label>
                            <input type="number" id="initialCapital" value="1000" class="w-full mt-1 border rounded px-2 py-1">
                        </div>
                        <div>
                            <label class="block text-slate-600 text-xs">運用期間 (年)</label>
                            <input type="number" id="years" value="20" min="1" max="50" class="w-full mt-1 border rounded px-2 py-1">
                        </div>
                    </div>
                    <div>
                        <label class="block text-slate-600 text-xs">シミュレーション描画数 (パス)</label>
                        <input type="number" id="simulations" value="100" min="10" max="1000" class="w-full mt-1 border rounded px-2 py-1">
                    </div>
                </div>

                <button id="runBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-lg transition-colors shadow-sm">
                    シミュレーション実行
                </button>
            </div>

            <!-- 結果表示・グラフエリア -->
            <div class="lg:col-span-2 space-y-6">
                <!-- 統計カード -->
                <div class="grid grid-cols-3 gap-4">
                    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-center">
                        <div class="text-xs text-slate-500">上位 10% (好調)</div>
                        <div id="statP90" class="text-lg md:text-xl font-bold text-emerald-600 mt-1">-</div>
                    </div>
                    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-center">
                        <div class="text-xs text-slate-500">中央値 (標準)</div>
                        <div id="statMedian" class="text-lg md:text-xl font-bold text-slate-800 mt-1">-</div>
                    </div>
                    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-center">
                        <div class="text-xs text-slate-500">下位 10% (不調)</div>
                        <div id="statP10" class="text-lg md:text-xl font-bold text-rose-600 mt-1">-</div>
                    </div>
                </div>

                <!-- グラフ描画カード -->
                <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                    <h2 class="font-bold text-slate-800 mb-4">資産推移 (対数・実数切り替え対応)</h2>
                    <div class="relative h-96">
                        <canvas id="simChart"></canvas>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
